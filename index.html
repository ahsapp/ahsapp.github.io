<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHSAPP - Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Temel Ayarlar */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Modern Gradyan Arka Plan */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Ana Konteynır */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Modern cam efekti */
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px border rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }

        /* Logo Ayarı */
        .logo img {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Google Play Butonu */
        .badge img {
            max-width: 220px;
            transition: transform 0.3s ease;
        }

        .badge img:hover {
            transform: scale(1.05); /* Hover efekti */
        }

        /* Yazı Stilleri */
        .tagline {
            font-size: 1.2rem;
            margin: 20px 0;
            font-style: italic;
            opacity: 0.9;
        }

        .footer {
            font-size: 0.8rem;
            margin-top: 30px;
            opacity: 0.6;
        }

        .play-text {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="./AHSAPP_files/g4591.png" alt="AHSAPP Logo">
        </div>

        <div class="tagline">
            "Various games and applications for you"
        </div>

        <div class="download-section">
            <span class="play-text">Google Play'de görüntüleyin</span>
            <a href="https://play.google.com/store/apps/dev?id=7606923165540402077" target="_blank" class="badge">
                <img src="./AHSAPP_files/google-play-badge (1).png" alt="Google Play Store">
            </a>
        </div>

        <div class="footer">
            2019 - 2026 AHSAPP
        </div>
    </div>

</body>
</html>
